name: Source-derived reproducibility checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify distributed scientific payload
        run: python verify_release.py
      - name: Run negative-path and input-admission tests
        run: python tests/test_guards.py
      - name: Derived-only audit (not raw-source reproduction)
        run: python reproduce.py --mode derived --out "$RUNNER_TEMP/h2-derived"
