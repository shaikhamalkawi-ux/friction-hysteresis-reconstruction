name: H2 Machines paper reproducibility
on:
  push:
    paths:
      - 'paper1_machines_2026/**'
      - '.github/workflows/h2-machines-2026.yml'
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper1_machines_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python verify_release.py
      - run: python tests/test_guards.py
      - run: python reproduce.py --mode derived --out "$RUNNER_TEMP/h2-machines-derived"
